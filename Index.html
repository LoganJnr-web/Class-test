<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Builders College Test</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1c2333;--muted:#5b647a;--accent:#1f6feb;--ok:#1a7f37;--bad:#c62828;--line:#dde1ea}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--text:#e8ebf4;--muted:#9aa3b8;--accent:#5b9cff;--ok:#4cc26b;--bad:#ff7b7b;--line:#2d3550}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:1.4rem;margin:.2em 0}
h2{font-size:1.15rem;margin:.4em 0}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);width:100%;margin:6px 0}
button{background:var(--accent);color:#fff;border:0;cursor:pointer;font-weight:600}
label.opt{display:block;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
label.opt input{width:auto;margin-right:8px}
.opt.ok,.ok{border-color:var(--ok);color:var(--ok)}.opt.bad,.bad{border-color:var(--bad);color:var(--bad)}
div.opt{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
#bar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;font-weight:700;z-index:2}
.note{border-left:4px solid var(--accent);font-size:.95rem}
.part{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;margin:18px 0 12px;font-weight:700;font-size:1.05rem}
.part.first{margin-top:4px}
.score{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.hide{display:none}.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<div id="start" class="card">
  <h1>Brain Builders College Test</h1>
  <p class="muted">Mathematics (20 questions) and English Language (40 questions). Total time: 40 minutes. The timer starts when you click Start.</p>
  <input id="name" placeholder="Your full name">
  <button onclick="startTest()">Start Test</button>
</div>

<div id="test" class="hide">
  <div id="bar"><span id="who"></span><span id="timer"></span></div>
  <div id="qs"></div>
  <button onclick="finish()">Submit Test</button>
</div>

<div id="result" class="card hide"></div>
</div>

<script>
// ---- EDIT HERE: add or change questions. Format: [question, [options], index of correct option (0 = first)]
// A plain text string in the list shows as an instruction/passage card (not scored).
const BANK = {

["Simplify √12 (√48 − √3)",["6","12","18","36"],2],
["Solve the simultaneous equations: 4x + 6y = 20 and 4x + 2y = 4",["x = 1, y = 4","x = −1, y = 4","x = 4, y = −1","x = −4, y = 1"],1],
["Find the range of values of x for which −9 ≤ 2x/3 − 7 < 5",["−3 ≤ x < 18","−3 < x ≤ 18","3 ≤ x < 18","−18 ≤ x < 3"],0],
["The 5th term of an A.P. is 17 and the 9th term is 33. Find the first term (a) and the common difference (d).",["a = 4, d = 1","a = 1, d = 4","a = 2, d = 5","a = 5, d = 3"],1],
["If k, 2k + 1 and 5k − 2 are consecutive terms of an A.P., find k.",["k = 1","k = 2","k = 3","k = 4"],1],

["Make u the subject of the formula E = m(v² − u²) ÷ 2g",["u = √(v² − 2gE/m)","u = √(v² + 2gE/m)","u = √(2gE/m − v²)","u = (v² − 2gE)/m"],0],
["Find the shortest distance between the points P(4, 3) and Q(2, −1).",["2√5","√12","4√5","√8"],0],

["Twenty students scored 0, 1, 2, 3 and 4 marks with frequencies 4, 2, 5, 6 and 3 respectively. If one student is picked at random, what is the probability that the student scored at least 2 marks?",["7/10","11/20","3/10","9/20"],0],
["Each exterior angle of a regular polygon is 30°. Calculate the sum of its interior angles.",["1440°","1620°","1800°","2160°"],2],
["Given that cos x = 12/13, find (1 − tan x) ÷ tan x.",["7/5","5/7","7/12","12/5"],0],
["A ladder 6 m long leans against a vertical wall at an angle of 53° to the horizontal. How high up the wall does it reach? (sin 53° = 0.7986, cos 53° = 0.6018)",["3.61 m","4.79 m","6.00 m","7.51 m"],1]],
"English":[
"<b>SECTION 1</b><br><i>In each of the following sentences, there is one underlined word and one gap. From the list of words lettered A to D, choose the one that is most nearly <b>opposite</b> in meaning to the underlined word and that will, at the same time, correctly fill the gap in the sentence.</i>",
["Obi’s family is known for their <u>audacity</u>, so one is surprised at his ______.",["Cowardice","irritability","moodiness","insolence"],0],
["Bayo is <u>careless</u> in his ways while Tayo is ______.",["lovable","meticulous","difficult","reserved"],1],
["In this country, the law against armed robbery is <u>stringent</u> whereas that against smoking in public places is ______.",["accurate","complex","lax","easy"],2],
["The purpose of education is to <u>facilitate</u> progress, not to ______ it.",["prevent","impede","stampede","restrain"],1],
["These days, many people concentrate on <u>temporal</u> things to the detriment of the ______.",["tangible","durable","unchanging","spiritual"],3],
["While your parents are ______, mine are <u>liberal</u> in their views.",["strict","intimidating","conservative","discerning"],2],

"<b>SECTION 2</b><br><i>From the words lettered A to D, choose the word that best completes each of the following sentences.</i>",
["The recent floods in some countries have ______ many lives.",["claimed","drowned","buried","injured"],0],

["The smaller boys had always drawn back in fear when the bully raised a fist, but this time they did not ______.",["advance","agree","retaliate","recoil"],2],
["The old man prayed for the ______ of his sins before he died.",["omission","commission","permission","remission"],3],
["Inflation has caused the cost of goods to ______.",["escalate","ascend","intensify","progress"],0],
["The economy of the country has remained ______ despite the crisis.",["strong","realistic","tough","firm"],3],
"<b>SECTION 3</b><br><i>After each of the following sentences, a list of possible interpretations is given. Choose the interpretation that is <b>most appropriate</b> for each sentence.</i>",
["The principal raised eyebrows at the student’s explanation. This means that the principal ______.",["was unhappy about the explanation","rejected the explanation","considered the explanation","was surprised by the explanation"],3],
["Mary made a clean breast of everything. This means that Mary ______.",["won everyone over","told the whole truth","did everything efficiently","changed the way things were done"],1],
["Had it not rained, I would have visited you. This means that ______.",["I visited you even though it rained","it did not rain and so I visited you","it rained so I did not visit you","because it did not rain I visited you"],2],
["I hadn’t finished talking to Halima, when she snapped my head off. This means that she ______.",["gave me a sharp slap","rudely interrupted me","hissed at me","ordered me to stop talking"],1],

["My friend is as dull as ditchwater. This means that my friend is ______.",["dark in complexion","extremely boring","not intelligent","not a troublemaker"],1],
["The director sees Tim as the joker in the pack. This means that the director considers Tim to be ______.",["unpredictable","humourous","nonchalant","un… (option D was cut off in the photo – edit me)"],0],
"<b>SECTION 6 – Passage</b><br><i>In the following passage, the numbered gaps indicate missing words. For each gap, choose the word that is most suitable to fill it.</i><br><br>Within the last quarter of the twentieth century, medical experts have been laying emphasis on <b>(71)</b> rather than <b>(72)</b> measures. Through primary health care programmes, people have been taught about these. When an individual <b>(73)</b> a disease, he has to see a doctor for <b>(74)</b>. At times, the doctor finds it difficult to <b>(75)</b> the disease during the initial examination of the patient because many diseases have similar <b>(76)</b>. When this happens, the patient is either asked to go to the <b>(77)</b> for one test or the other or he would have <b>(78)</b> taken to help the doctor find out what is happening internally. It is after all these, and sometimes more, that the doctor can <b>(79)</b> some drugs for the individual and perhaps give him some <b>(80)</b>. To save yourself and everyone else from this headache, it is advisable to pay heed to public health programmes.",
["Passage gap <b>(71)</b>",["effective","protective","defensive","preventive"],3],
["Passage gap <b>(72)</b>",["curative","healing","corrective","anaesthetic"],0],
["Passage gap <b>(73)</b>",["acquires","contracts","contacts","develops"],1],
["Passage gap <b>(74)</b>",["consultation","interaction","discussion","instruction"],0],
["Passage gap <b>(75)</b>",["explain","discover","diagnose","detect"],2],
["Passage gap <b>(76)</b>",["signs","indications","symptoms","dues"],2],
["Passage gap <b>(77)</b>",["pharmacy","infirmary","ward","laboratory"],3],
["Passage gap <b>(78)</b>",["an image","an x-ray","a film","a photograph"],1],
["Passage gap <b>(79)</b>",["prescribe","write","select","dictate"],0],
["Passage gap <b>(80)</b>",["concoction","syringes","additives","injections"],3]]
};
const SUBJECTS = ["Mathematics","English"];   // order shown in the test
const LABELS = {"Mathematics":"Mathematics","English":"English Language"};
const MINUTES = 40;                              // total time for the whole test
// -----------------------------------------------------------------

const $ = id => document.getElementById(id);
let current = [], timerId, secs, student, done = false, results = {};

function startTest(){
  student = $("name").value.trim();
  if(!student){ alert("Please enter your name."); return; }
  done = false; current = [];
  $("start").classList.add("hide");
  $("test").classList.remove("hide");
  $("who").textContent = student;
  let n = 0, html = "";
  SUBJECTS.forEach((s, k) => {
    const count = BANK[s].filter(Array.isArray).length;
    html += `<div class="part${k===0?" first":""}">PART ${k+1}: ${LABELS[s].toUpperCase()} (${count} questions)</div>`;
    BANK[s].forEach(q => {
      if(typeof q === "string"){ html += `<div class="card note">${q}</div>`; return; }
      const i = n++;
      current.push({s, q});
      html += `<div class="card"><b>${i+1}. ${q[0]}</b>` +
        q[1].map((o,j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}">${"ABCD"[j]}. ${o}</label>`).join("") +
        `</div>`;
    });
  });
  $("qs").innerHTML = html;
  secs = MINUTES * 60;
  tick();
  timerId = setInterval(tick, 1000);
}

function tick(){
  const m = String(Math.floor(secs/60)).padStart(2,"0"), s = String(secs%60).padStart(2,"0");
  $("timer").textContent = "⏱ " + m + ":" + s;
  if(secs-- <= 0) finish(true);
}

function finish(auto){
  if(done) return;
  if(!auto){
    const left = current.filter((c,i) => !document.querySelector(`input[name="q${i}"]:checked`)).length;
    const msg = left ? `You have ${left} unanswered question(s). Submit your test now?` : "Submit your test now?";
    if(!confirm(msg)) return;
  }
  done = true;
  clearInterval(timerId);
  results = {};
  SUBJECTS.forEach(s => results[s] = {score:0, total:0, review:""});
  current.forEach((c,i) => {
    const q = c.q, r = results[c.s];
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const pick = sel ? +sel.value : -1;
    const right = pick === q[2];
    r.total++;
    if(right) r.score++;
    r.review += `<div class="opt ${right?"ok":"bad"}"><b>${i+1}. ${q[0]}</b><br>` +
      `Your answer: ${pick<0?"No answer":q[1][pick]}` +
      (right ? " ✓" : `<br>Correct answer: ${q[1][q[2]]}`) + `</div>`;
  });
  const total = current.length;
  const got = SUBJECTS.reduce((a,s) => a + results[s].score, 0);
  const pct = Math.round(got / total * 100);
  $("test").classList.add("hide");
  $("result").classList.remove("hide");
  $("result").innerHTML = `<h1>${student}, you scored ${got}/${total} (${pct}%)</h1>
    <p class="muted">Brain Builders College Test</p>
    <label for="view"><b>View result for:</b></label>
    <select id="view" onchange="showView()">
      <option value="all">Summary – both subjects</option>
      ${SUBJECTS.map(s => `<option value="${s}">${LABELS[s]}</option>`).join("")}
    </select>
    <div id="detail"></div>
    <button onclick="location.reload()">Take another test</button>`;
  showView();
  window.scrollTo(0,0);
}

function showView(){
  const v = $("view").value, box = $("detail");
  if(v === "all"){
    box.innerHTML = SUBJECTS.map(s => {
      const r = results[s];
      return `<div class="score"><span>${LABELS[s]}</span><b>${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</b></div>`;
    }).join("");
  } else {
    const r = results[v];
    box.innerHTML = `<h2>${LABELS[v]}: ${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</h2>` + r.review;
  }
}
</script>
</body>
</html>
